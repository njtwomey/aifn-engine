[project]
name = "aifn-engine-fixtures"
version = "0.0.0"
description = "Python references that generate the golden test values of aifn-engine (make fixtures)."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "ruff>=0.12",
]
fixtures = [
    "astropy>=8.0.1",
    "biopython>=1.88",
    "captum>=0.9.0",
    "choix>=0.4.1",
    "control>=0.10.2",
    "datasketch>=2.0.0",
    "imbalanced-learn>=0.14.2",
    "implicit>=0.7.3",
    "lifelines>=0.30.3",
    "mpmath>=1.3.0",
    "networkx>=3.7",
    "nltk>=3.10.3",
    "opacus>=1.6.0",
    "pot>=0.9.7.post1",
    "pysubgroup>=0.8.0",
    "python-crfsuite>=0.9.12",
    "pywavelets>=1.10.0",
    "regex>=2026.9.29",
    "scikit-image>=0.26.0",
    "shap>=0.49.1",
    "statsmodels>=0.15.0",
    "stumpy>=1.14.1",
    "tiktoken>=0.14.0",
    "tokenizers>=0.22",
    "torchdiffeq>=0.2.5",
    "trueskill>=0.4.5",
    "trueskillthroughtime>=1.1.0",
]

[tool.uv]
# Not a package: the project only pins the reference libraries the fixture generators import.
package = false
default-groups = ["dev", "fixtures"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Maths notation in docstrings and comments is intentional.
allowed-confusables = ["σ", "−", "–", "×", "ν", "ρ", "α", "γ"]

[tool.pyright]
include = ["packages/compute/test/fixtures", "packages/methods/test/fixtures", "scripts"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false

# PyTorch from its CPU-only index on Linux, so CI does not download CUDA libraries; macOS wheels are CPU-only already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
